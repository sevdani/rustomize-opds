name: Mainline Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Run without making changes (preview only)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  bump_version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version_step.outputs.new_version }}
      old_version: ${{ steps.bump_version_step.outputs.old_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version
        id: bump_version_step
        run: |
          # Read current version from Cargo.toml
          CURRENT_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/.*"\([^"]*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Determine new version based on bump type
          case "${{ inputs.version_bump }}" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          echo "New version: $NEW_VERSION"
          
          # Update Cargo.toml if not dry run
          if [ "${{ inputs.dry_run }}" == "false" ]; then
            sed -i "s/^version = \".*\"$/version = \"$NEW_VERSION\"/" Cargo.toml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml
            git commit -m "chore: bump version to $NEW_VERSION"
            git push
          fi
          
          # Set outputs
          echo "old_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "### Dry Run Summary"
          echo "- Current version: ${{ steps.bump_version_step.outputs.old_version }}"
          echo "- Selected bump: ${{ inputs.version_bump }}"
          echo "- Would become: ${{ steps.bump_version_step.outputs.new_version }}"
          echo "- No changes were made."

  tag_release:
    name: Create and Push Tag
    runs-on: ubuntu-latest
    needs: bump_version
    if: inputs.dry_run != true
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create and push tag
        id: create_tag
        run: |
          NEW_VERSION="${{ needs.bump_version.outputs.new_version }}"
          TAG_NAME="v${NEW_VERSION}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create annotated tag
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          
          # Push tag to remote
          git push origin "$TAG_NAME"
          
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Created tag: $TAG_NAME"

  build-release:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    needs: tag_release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rustomize-opds
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: rustomize-opds
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: rustomize-opds.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          retention-days: 7

  publish:
    name: Publish to Cargo
    runs-on: ubuntu-latest
    needs: [bump_version, tag_release]
    if: inputs.dry_run != true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Publish to crates.io
        run: cargo publish --token $CRATES_IO_TOKEN
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish, tag_release]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rustomize-opds-*
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ needs.tag_release.outputs.tag_name }}
          tag_name: ${{ needs.tag_release.outputs.tag_name }}
          body: |
            ## Release ${{ needs.tag_release.outputs.tag_name }}
            
            - **New version**: ${{ needs.bump_version.outputs.new_version }}
            - **Previous version**: ${{ needs.bump_version.outputs.old_version }}
            - **Bump type**: ${{ inputs.version_bump }}
            
            ## Changes
            
            * Automatic version bump via GitHub Actions
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
